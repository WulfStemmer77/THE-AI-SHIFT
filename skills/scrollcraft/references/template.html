<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="">
  <title>Scrollcraft build</title>
  <link rel="stylesheet" href="./scrollcraft.css">
</head>
<body>
  <main>
    <section data-sc-act="scrub" data-sc-span="2.6" data-sc-dwell="0.25">
      <div data-sc-stage>
        <img class="sc-stage__poster" src="assets/hero-poster.webp" alt="">
        <video data-sc-scrub data-sc-src="assets/hero.mp4" data-sc-src-mobile="assets/hero-mobile.mp4" muted playsinline></video>
        <div class="sc-scrim"></div>
        <div class="sc-copy" data-sc-cue="0 0.68 0 0.24">
          <h1 class="sc-display sc-display--xl">Author the real headline.</h1>
        </div>
      </div>
    </section>

    <section class="sc-section">
      <h2 class="sc-display">A calm flow section for substance.</h2>
      <p class="sc-prose">Use ordinary document flow when the reader needs to understand something.</p>
    </section>
  </main>
  <script src="./scrollcraft.js"></script>
</body>
</html>
